# ═══════════════════════════════════════════════════════════════
# docker-compose — M6 Ambiente, Higiene y Servicios Urbanos
# Levanta: postgres + backend + frontend + RabbitMQ (comentado)
# Uso: docker-compose up --build
# ═══════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: m6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m6-network

  # ─── Backend (NestJS + Prisma) ──────────────────────────────
  backend:
    build:
      context: ./Backend-M6-DAPS2
      dockerfile: Dockerfile
    container_name: m6-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      # RABBITMQ_URL: ${RABBITMQ_URL}
      # RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      # RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE}
      # RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      # RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE}
      # RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    networks:
      - m6-network

  # ─── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ./Frontend-M6-DAPS2
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: m6-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    networks:
      - m6-network

  # ─── RabbitMQ (comentado — descomentar cuando se necesite eventos) ──
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: m6-rabbitmq
  #   restart: unless-stopped
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-m6_user}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-m6_pass}
  #   ports:
  #     - "5672:5672"      # AMQP
  #     - "15672:15672"    # Management UI (http://localhost:15672)
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - m6-network

networks:
  m6-network:
    driver: bridge

volumes:
  postgres-data:
  # rabbitmq-data:
