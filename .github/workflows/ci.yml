# ──────────────────────────────────────────────────────────────
# CI/CD — Integración continua + deploy del backend M6
# Se ejecuta en PRs y pushes a develop/test/main.
#
# IMPORTANTE: los jobs "build" y "test" se llaman exactamente así
# porque así lo exige la branch protection (.github/branch-protection-rules.json).
# No renombrarlos sin actualizar esa regla.
#
# Deploy: en push a main (release develop → test → main, desde el 22/10), y
# SOLO si build+test pasan, se dispara el deploy en Render vía Deploy Hook URL
# (secret RENDER_DEPLOY_HOOK_URL), desplegando el commit exacto que se mergeó.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]
  # Solo para el job `sonar` (ver más abajo); el resto corre igual.
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sin dependencias: va antes de `npm ci` para fallar rápido. Valida el
      # tablero de docs/bloqueantes.md y los enlaces de docs/integracion/ (#312).
      - name: Documentación de integración
        run: npm run docs:check

      # Cachea node_modules entero (no solo las descargas de npm): un acierto
      # se salta el `npm ci`. La clave es el lockfile, así que un cambio de
      # dependencias lo invalida. #632
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      # Sin --fix: en CI el lint verifica, no corrige.
      - name: Lint
        run: npm run lint:check

      # El contrato versionado tiene que reflejar el codigo. Si alguien cambia
      # un DTO y no corre `npm run openapi:generate`, el frontend se queda
      # validando contra una forma que ya no existe.
      - name: Contrato OpenAPI al dia
        run: |
          npm run openapi:generate
          git diff --exit-code docs/api/openapi.json             || (echo "::error::docs/api/openapi.json quedo desactualizado. Corre 'npm run openapi:generate' y commiteá el resultado." && exit 1)

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cachea node_modules entero (no solo las descargas de npm): un acierto
      # se salta el `npm ci`. La clave es el lockfile, así que un cambio de
      # dependencias lo invalida. #632
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # ts-jest chequeaba los tipos de los specs al correrlos; SWC (Vitest) no.
      # Este paso conserva ese chequeo (#628).
      - name: Typecheck specs
        run: npm run typecheck

      # Con cobertura: el DoD exige >= 85% en los archivos tocados y hasta #152
      # no lo verificaba nadie. Los umbrales viven en coverage.thresholds
      # (vitest.config.ts); si la cobertura baja, este paso falla y no se deploya.
      - name: Run tests
        run: npm run test:cov

      # lcov para el job `sonar`: así no se vuelven a correr los tests (#657).
      - name: Subir cobertura (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # sonar — Análisis en SonarCloud con la cobertura del job `test` (#657).
  #
  # Paso 1 de la opción C de #656: el gate NO bloquea (qualitygate.wait=false)
  # y el job no es check obligatorio de la branch protection. Se saltea sin
  # SONAR_TOKEN (PRs de forks, que no reciben secrets). Configuración del
  # proyecto en sonar-project.properties.
  # ──────────────────────────────────────────────────────────────
  sonar:
    name: sonar
    needs: test
    # El plan Free de SonarQube Cloud solo analiza la rama principal (`main`) y
    # los PRs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/branch-analysis/branch-analysis
    # Por eso no corre en push a develop/test. `workflow_dispatch` sube un
    # análisis manual de la rama principal (ver args del paso SonarCloud).
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout (historial completo, lo pide Sonar para atribuir código nuevo)
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Descargar cobertura (lcov)
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          # En el disparo manual el scanner vería la rama de trabajo como una rama
          # más (el plan Free la rechaza): se fuerza `main` solo ahí.
          args: -Dsonar.qualitygate.wait=false ${{ github.event_name == 'workflow_dispatch' && '-Dsonar.branch.name=main' || '' }}

  # ──────────────────────────────────────────────────────────────
  # e2e — La app completa contra un Postgres de verdad.
  #
  # NO es check obligatorio de la branch protection (ahí solo están "build" y
  # "test"): los e2e tardan y dependen de un servicio externo, y bloquear el
  # merge por un contenedor que no levantó no aporta. Se mira igual.
  #
  # La base es descartable y las suites truncan todas las tablas. El helper de
  # test/ se niega a correr si DATABASE_URL no apunta a localhost.
  # ──────────────────────────────────────────────────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No usa el GITHUB_TOKEN: sin permisos.
    permissions: {}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m6
          POSTGRES_PASSWORD: m6
          POSTGRES_DB: m6_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m6 -d m6_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Para test/rabbitmq-real.e2e-spec.ts (#575) y test/outbox-rabbitmq-real.e2e-spec.ts
      # (#618). La imagen -management trae la API HTTP (15672) con la que los
      # tests le cierran la conexión al consumer y al publisher.
      rabbitmq:
        image: rabbitmq:4.4-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Sin JWT_SECRET: test/helpers.ts lo pisa con uno de juguete igual.
    env:
      DATABASE_URL: postgresql://m6:m6@localhost:5432/m6_e2e?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cachea node_modules entero (no solo las descargas de npm): un acierto
      # se salta el `npm ci`. La clave es el lockfile, así que un cambio de
      # dependencias lo invalida. #632
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # Las migraciones las aplica test/global-setup.ts, después del guard.
      # Sin cobertura: el 85% del DoD se mide con los unitarios (job "test").
      # Mezclar los dos reportes es una mejora posterior, no un requisito.
      # Sin RABBITMQ_URL en este paso: activaría el consumer en todas las suites.
      - name: Run e2e tests
        run: npm run test:e2e -- --exclude '**/*rabbitmq-real*'

      - name: Run e2e tests (RabbitMQ real)
        run: npm run test:e2e -- rabbitmq-real --no-file-parallelism
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

  # ──────────────────────────────────────────────────────────────
  # secrets — Escaneo de secretos sobre TODO el historial (gitleaks).
  #
  # Como e2e, no es check obligatorio ni frena el deploy; se mira igual. Usa la
  # imagen oficial fijada en vez de la acción para no depender de licencias.
  # Las excepciones (valores de ejemplo y de prueba) están en .gitleaks.toml.
  # ──────────────────────────────────────────────────────────────
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="--all"

  # secrets-default: lo mismo que `secrets` pero como lo corre la cátedra:
  # gitleaks con la configuración POR DEFECTO (se borra .gitleaks.toml y se respeta
  # .gitleaksignore, que es lo que ve la cátedra; el historial no se toca) y trufflehog,
  # sobre todas las ramas y tags. Muestra qué ve una herramienta
  # sin nuestras excepciones (frena si gitleaks por defecto encuentra algo en el historial, o si
  # trufflehog verifica una credencial viva). Los reportes se publican como artifact con los
  # valores redactados (en trufflehog se eliminan Raw/RawV2).
  secrets-default:
    name: secrets-default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (historial completo, todas las ramas y tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Carpeta de reportes
        run: echo "REPORTS=$RUNNER_TEMP/secrets-reports" >> "$GITHUB_ENV"

      - name: Gitleaks con configuración por defecto
        continue-on-error: true
        run: |
          rm -f .gitleaks.toml
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/repo" -v "$REPORTS:/reports" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="--all" \
            --report-format json --report-path /reports/gitleaks-default.json || true # se evalúa en el último paso
          # Estado actual de los archivos (no el historial).
          docker run --rm -v "$PWD:/repo" -v "$REPORTS:/reports" zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner \
            --report-format json --report-path /reports/gitleaks-default-worktree.json

      - name: Trufflehog (acción oficial, historial de la rama)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          head: HEAD
          version: 3.99.9
          extra_args: --results=verified,unknown,unverified,filtered_unverified

      - name: Trufflehog JSON sobre todas las ramas y tags
        continue-on-error: true
        run: |
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/tmp" -w /tmp ghcr.io/trufflesecurity/trufflehog:3.99.9 \
            git file:///tmp/ --json --no-update \
            --results=verified,unknown,unverified,filtered_unverified \
            > "$REPORTS/trufflehog-raw.jsonl"
          jq -c 'del(.Raw, .RawV2)' "$REPORTS/trufflehog-raw.jsonl" \
            > "$REPORTS/trufflehog-default.jsonl"
          rm "$REPORTS/trufflehog-raw.jsonl"
          # Estado actual de los archivos (no el historial).
          printf '/\\.git/\n' > "$RUNNER_TEMP/th-exclude.txt"
          docker run --rm -v "$PWD:/tmp" -v "$RUNNER_TEMP/th-exclude.txt:/th-exclude.txt" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.99.9 \
            filesystem /tmp --json --no-update --exclude-paths=/th-exclude.txt \
            --results=verified,unknown,unverified,filtered_unverified \
            | jq -c 'del(.Raw, .RawV2)' > "$REPORTS/trufflehog-default-worktree.jsonl"

      # Frenantes del job: algún hallazgo de gitleaks por defecto en el historial
      # (los valores de juguete ya conocidos están en .gitleaksignore) o una
      # credencial VERIFICADA como viva por trufflehog. Trufflehog sin verificar y
      # el estado actual de los archivos son informativos.
      - name: Fallar ante hallazgos de gitleaks o verificados de trufflehog
        run: |
          g=$(jq 'length' "$REPORTS/gitleaks-default.json")
          v=$(jq -s '[.[] | select(.Verified == true)] | length' "$REPORTS/trufflehog-default.jsonl" "$REPORTS/trufflehog-default-worktree.jsonl")
          echo "gitleaks (historial, sin .gitleaks.toml): $g hallazgos; trufflehog verificados: $v"
          test "$g" -eq 0 && test "$v" -eq 0

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-default-reports
          path: ${{ runner.temp }}/secrets-reports/
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # audit — Vulnerabilidades de dependencias de producción.
  #
  # Gate: una vulnerabilidad alta o crítica en producción pone el CI en rojo.
  # Fue informativo (un `if/else` con warning) mientras hubo altas que solo
  # arreglaba NestJS 12 / zod 4; con NestJS 12 (#628) el audit de producción
  # da 0 (informe QA 07 §5.1).
  # ──────────────────────────────────────────────────────────────
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit (producción, severidad alta)
        run: npm audit --omit=dev --audit-level=high

  # ──────────────────────────────────────────────────────────────
  # trivy — Segundo SCA, independiente de `npm audit` (#658, spec #656).
  #
  # Tres pasadas: fs (lockfile + secretos), image (la imagen del Dockerfile) y
  # config (Dockerfile y docker-compose.yml). Cada una hace dos cosas:
  #   1. REPORTE: SARIF a Code Scanning, con HIGH/CRITICAL incluidas las que
  #      todavía no tienen fix (la cátedra pide "mitigación documentada", no
  #      "ignoradas"). No falla nunca.
  #   2. GATE: tabla en el log y falla con HIGH/CRITICAL que SÍ tengan fix
  #      (ignore-unfixed solo acá). Las sin fix se documentan en .trivyignore
  #      y en docs/QA/07-informe-seguridad.md.
  #
  # Como `audit`: frena el deploy (needs de `deploy`), no el merge; no está en
  # la branch protection. security-events: write solo en este job.
  # trivy-action va fijada por SHA del commit (tag v0.36.0).
  # ──────────────────────────────────────────────────────────────
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      # Los PRs de forks y de Dependabot reciben un token sin security-events:
      # ahí se corre el gate pero no se sube el SARIF.
      CAN_UPLOAD: ${{ !(github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build de la imagen
        run: docker build -t m6-backend:ci .

      # ── Reporte (SARIF, incluye las sin fix) ──
      - name: Reporte fs (dependencias y secretos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Reporte image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: m6-backend:ci
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Reporte config (Dockerfile y compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - name: Subir fs a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Subir image a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Subir config a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # ── Gate (HIGH/CRITICAL con fix) ──
      - name: Gate fs
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Gate image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: m6-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Gate config
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

  # ──────────────────────────────────────────────────────────────
  # deploy — Dispara el deploy en Render (solo push a main).
  # Depende de build+test y de los gates audit y trivy: si el CI falla, no se deploya.
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: [build, test, audit, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger deploy en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -f -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
