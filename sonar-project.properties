# SonarCloud — Backend M6 (#657). El análisis lo corre el job `sonar` del CI con
# el lcov que genera el job `test`; Automatic Analysis está apagado.
sonar.organization=hllous
sonar.projectKey=hllous_Backend-M6-DAPS2
sonar.projectName=Backend-M6-DAPS2
sonar.sourceEncoding=UTF-8

# Alcance: con el "analysis scope" nuevo de SonarQube Cloud se analiza el repo
# entero (sonar.sources/tests/test.inclusions ya no tienen efecto). No se excluye
# nada del análisis: los hallazgos de src, test, scripts, workflows y Dockerfile
# cuentan (G9).

# Cobertura: el reporte lo produce `npm run test:cov` (Vitest, v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Las primeras 9 entradas son IDÉNTICAS a coverage.exclude de vitest.config.ts.
# Las demás son el complemento de coverage.include (Vitest solo mide `src/**` y
# scripts/migrate-crew-user-ids.ts); sin ellas Sonar contaría como "sin cubrir"
# el seed, los scripts, los e2e y los workflows, y la cifra no sería comparable.
sonar.coverage.exclusions=**/*.spec.ts,**/*.module.ts,**/dto/**,**/index.ts,src/main.ts,src/configure-app.ts,src/config/**,src/events/update-ticket-status-schema.testing.ts,src/prisma/**,prisma/**,test/**,.github/**,*.js,*.ts,scripts/api-flujos.mjs,scripts/build-*,scripts/check-*,scripts/core-*,scripts/export-*,scripts/generate-*,scripts/zones-*

# Duplicación: las migraciones y los DTOs son repetitivos por diseño; los specs
# son tests (arrange/act/assert parecidos), no lógica del equipo.
sonar.cpd.exclusions=prisma/migrations/**,**/dto/**,**/*.spec.ts,**/*.e2e-spec.ts

# Excepciones acotadas (una regla + un archivo), justificadas y para revisión humana.
# e1 (#698): secrets:S6698 en docker-compose.yml. La «clave» de PostgreSQL de la URL
# es el default de ejemplo `cambiame` (el mismo de .env.example), de una base local y
# efímera que solo escucha en 127.0.0.1; existe para que `docker compose up` funcione
# sin .env (criterio G1). No se usa en Render, donde DATABASE_URL es otra y secreta.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e1.resourceKey=docker-compose.yml
