# SonarCloud — Backend M6 (#657). El análisis lo corre el job `sonar` del CI con
# el lcov que genera el job `test`; Automatic Analysis está apagado.
sonar.organization=hllous
sonar.projectKey=hllous_Backend-M6-DAPS2
sonar.projectName=Backend-M6-DAPS2

sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Cobertura: el reporte lo produce `npm run test:cov` (Vitest, v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# IDÉNTICAS a coverage.exclude de vitest.config.ts (si cambia una, cambia la otra).
sonar.coverage.exclusions=**/*.spec.ts,**/*.module.ts,**/dto/**,**/index.ts,src/main.ts,src/configure-app.ts,src/config/**,src/events/update-ticket-status-schema.testing.ts,src/prisma/**

# Duplicación: las migraciones y los DTOs son repetitivos por diseño.
sonar.cpd.exclusions=prisma/migrations/**,**/dto/**
